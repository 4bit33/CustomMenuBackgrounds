# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.6.7-hotspot

# Minecraft / mappings
# NOTE: This project targets Minecraft 1.21.1 because it is the most recent
# version for which the author could verify exact Yarn mapping names
# (class/method names used by the mixins in this mod) with confidence.
# Minecraft itself has since moved to a year-based versioning scheme
# (e.g. 26.1 / 26.2) - see the README "Version notes" section for how
# to port this project forward.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod
mod_version=1.0.0
maven_group=com.cmb
archives_base_name=custommenubackgrounds

# Fabric API
fabric_version=0.105.0+1.21.1

# Video decoding (JavaCV / FFmpeg bindings) - see README, this dependency
# is large (native FFmpeg binaries bundled per-platform).
javacv_version=1.5.10
