# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# NOTE: do NOT add org.gradle.java.home here (machine-specific absolute path).
# Run Gradle itself on JDK 21+: JAVA_HOME=<path-to-jdk-21> ./gradlew build
# (fabric-loom 1.14.1 requires the Gradle runtime JVM to be 21+).



# Minecraft / mappings — CUI targets exactly 1.21.11 per spec §23/32.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.18.1

# Mod — CUI (CustomUI)
mod_version=1.0.1
maven_group=com.cmb
archives_base_name=cui

# Fabric API — must match minecraft_version
fabric_version=0.141.6+1.21.11

# Video decoding (JavaCV / FFmpeg bindings) - see README, this dependency
# is large (native FFmpeg binaries bundled per-platform).
javacv_version=1.5.10
