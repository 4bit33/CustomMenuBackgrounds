plugins {
    id 'fabric-loom' version '1.8.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    // JavaCV / JavaCPP (used for WebM/MP4 video decoding)
    maven { url = "https://repo1.maven.org/maven2/" }
}

loom {
    // We ship our own mixin config; nothing extra required here.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.1"

    // --- GSON is already shipped by Minecraft, used for config (no extra dep needed) ---

    // --- Video decoding: JavaCV bundles FFmpeg native libraries so we can decode
    // WebM/MP4 without shelling out to an external ffmpeg binary. Only the
    // desktop platforms Minecraft itself supports are included to keep the
    // jar size down (still large - see README).
    implementation "org.bytedeco:javacv:${project.javacv_version}"
    implementation "org.bytedeco:ffmpeg:6.1.1-1.5.10:windows-x86_64"
    implementation "org.bytedeco:ffmpeg:6.1.1-1.5.10:linux-x86_64"
    implementation "org.bytedeco:ffmpeg:6.1.1-1.5.10:macosx-x86_64"
    implementation "org.bytedeco:ffmpeg:6.1.1-1.5.10:macosx-arm64"

    // Bundle the runtime deps directly into the mod jar via the shadow-less
    // "include" mechanism Loom provides for pure-Java jars added to the
    // mod's own classpath.
    include "org.bytedeco:javacv:${project.javacv_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
